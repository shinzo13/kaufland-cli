[project]
name = "kaufland-cli"
version = "0.1.0"
description = "Unofficial CLI for Kaufland Card digital receipts"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
keywords = ["kaufland", "receipts", "cli", "loyalty"]
classifiers = [
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = []

[project.scripts]
kaufland = "kaufland_cli.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kaufland_cli"]

[tool.ruff]
line-length = 110
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
